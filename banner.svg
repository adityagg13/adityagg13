<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Developer Runtime">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0c1426"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glowA)"/>
  <rect width="1200" height="340" fill="url(#glowB)"/>

  <circle cx="1080" cy="70" r="150" fill="none" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="1080" cy="70" r="110" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="1080" cy="70" r="70" fill="none" stroke="#f472b6" stroke-opacity="0.10" stroke-width="1"/>

  <rect x="0" y="0" width="1200" height="3" fill="url(#line)"/>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="96" fill="#22d3ee" font-size="15" font-weight="600" letter-spacing="6" opacity="0.9">// PROFILE</text>

    <text x="70" y="176" fill="url(#accent)" font-size="62" font-weight="800" letter-spacing="2">DEVELOPER RUNTIME</text>

    <text x="72" y="219" fill="#cbd5e1" font-size="19" font-weight="400" letter-spacing="0.4">Windows optimizer · Emulator designer · Builder of small, sharp tools</text>

    <text x="72" y="262" fill="#64748b" font-size="15" font-family="'Cascadia Code', 'Consolas', monospace" letter-spacing="1">github.com/adityagg13</text>
  </g>

  <g>
    <rect x="72" y="286" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="131" y="306" text-anchor="middle" fill="#a5b4fc" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" letter-spacing="1.2">OPTIMIZE</text>

    <rect x="200" y="286" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="266" y="306" text-anchor="middle" fill="#67e8f9" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" letter-spacing="1.2">AUTOMATE</text>

    <rect x="342" y="286" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="394" y="306" text-anchor="middle" fill="#f9a8d4" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" letter-spacing="1.2">BUILD</text>
  </g>

  <g opacity="0.5">
    <path d="M1128 250 L1160 250 L1160 282" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <path d="M72 40 L72 24 L88 24" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
  </g>
</svg>
