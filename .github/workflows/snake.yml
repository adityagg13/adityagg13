# SNAKE ANIMATION — snake.yml
# Roz 00:00 UTC (05:30 IST) pe snake.svg generate hota hai aur `output` branch pe push hota hai.
#
# ZAROORI: Repo Settings > Actions > General > Workflow permissions
#   > "Read and write permissions" select karo > Save

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # manually bhi run kar sakte ho
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # palette ko outputs ke query string me dena hota hai (svg_palettes input exist nahi karta)
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
